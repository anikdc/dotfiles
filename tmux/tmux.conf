# ==========================================
# TMUX Configuration
# ==========================================

# --- Key Bindings & Prefix ---
unbind C-SPACE
set -g prefix C-b
bind C-b send-prefix

# VI keybindings for copy mode
set -g mode-keys vi

# Copy to pbcopy on macOS or clip.exe under MSYS2.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif [ -x /c/Windows/System32/clip.exe ]; then /c/Windows/System32/clip.exe; else cat >/dev/null; fi'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif [ -x /c/Windows/System32/clip.exe ]; then /c/Windows/System32/clip.exe; else cat >/dev/null; fi'

# Reload configuration shortcut
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

# Toggle status bar visibility
bind b set -g status

# Environment debugging
bind E show-environment -g

# Quick session killing with confirmation
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Seamless pane navigation (standard prefix bindings)
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

# --- General Settings ---
set -g default-terminal "tmux-256color"
set -a terminal-features "tmux-256color:RGB"  # Truecolor support
set -g base-index 1                            # Start window numbering at 1
set -g renumber-windows on                     # Automatically renumber windows when one is closed
set -g mouse on                                # Mouse support (resizing, pane selection, scrolling)
set -g set-clipboard on
set -g history-limit 50000                     # Boost history scrollback buffer
set -sg escape-time 0                          # Address vim mode-switching delay

# --- Status Bar & Appearance ---
set -g status-position top                     # Put status bar at the top
set -g status-justify absolute-centre          # Center window list
set -g status-style "bg=default"               # Transparent status bar
set -g window-status-current-style "fg=black bg=white" # Highlight active window
set -g status-interval 30                      # Avoid unnecessary status refresh work

# Custom status layout
set -g status-left-length 100
set -g status-left "#[fg=green]Session: #S"
set -g status-right ""

# ==========================================
# Tmux Plugin Manager (TPM)
# ==========================================
# To install TPM and plugins:
# Prefix + I: Installs new plugins and refreshes the TMUX environment.
# Prefix + U: Updates plugins.
# Prefix + alt + u: Uninstall plugins not in list.

# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jaclu/tmux-menus'

set -g @menus_trigger 'M'
set -g @menus_config_file '~/.config/tmux/tmux.conf'
bind-key M run-shell '~/.tmux/plugins/tmux-menus/items/main.sh'
bind-key m run-shell '~/.tmux/plugins/tmux-menus/items/main.sh'

# Start cleanly before TPM is installed.
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
