# Merge these preferences into the config generated by Codex on macOS.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "priority"

[features]
js_repl = false
memories = true

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
show-context-window-usage = true
followUpQueueMode = "steer"
dictationDictionary = []
appearanceLightCodeThemeId = "codex"
appearanceDarkCodeThemeId = "ayu"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"

[desktop.appearanceDarkChromeTheme]
accent = "#e6b450"
contrast = 60
ink = "#bfbdb6"
opaqueWindows = false
surface = "#10141c"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#70bf56"
diffRemoved = "#f26d78"
skill = "#d0a1ff"

[memories]
generate_memories = true
use_memories = true
